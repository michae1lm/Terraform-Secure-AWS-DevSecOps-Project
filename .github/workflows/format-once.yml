name: One-time Terraform formatter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Canonical Terraform formatting
        run: terraform fmt -recursive
      - name: Commit formatted Terraform code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Apply canonical terraform fmt to all modules"
            git push origin HEAD:main
          fi
